<div class="terminal">
  <div class="output">
    <p *ngFor="let item of output" class="text-left">
      {{ item }}
    </p>
  </div>
  <div class="input">
    <pre>C:/Users/{{ user }}> </pre>
    <input
      [(ngModel)]="input"
      id="input"
      type="text"
      class="w-full bg-black focus:outline-none"
      (keydown.enter)="Enter()"
      autofocus
    />
  </div>
</div>
