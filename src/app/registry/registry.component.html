<h2 class="mt-4">Currently inspecting: {{ currentname }}</h2>

<p class="mb-6">Firestore list of marked EXITES on this BRANCH</p>

<div class="w-full flex justify-center">
  <div class="w-96 h-72 bg-slate-950 grid grid-cols-3 gap-2 overflow-y-scroll">
    <div
      *ngFor="let name of displayNames"
      class="px-2 hover:bg-white hover:bg-opacity-10 transition-all duration-300 cursor-default py-4 my-auto"
    >
      {{ name }}
    </div>
  </div>
</div>
<p class="my-4">Current access to READ & WRITE.</p>

<form (submit)="addName()" class="flex flex-row justify-center">
  <input type="text" [(ngModel)]="newname" name="newname" class="px-2" />
  <button type="submit" class="px-2 border border-green-600">Add</button>
</form>

<form (submit)="deleteName()" class="flex flex-row justify-center">
  <input type="text" [(ngModel)]="removeinput" name="newname" class="px-2" />
  <button type="submit" class="px-2 border border-green-600">Delete</button>
</form>
